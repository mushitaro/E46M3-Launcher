[versions]
agp = "8.7.3"
kotlin = "2.0.21"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
# androidx.browser carries TrustedWebActivityIntentBuilder + CustomTabsIntent.
browser = "1.8.0"
# FTDI/CH340 USB-serial. Not written by hand: the chip families encode baud
# divisors differently and every FTDI read packet is prefixed with two modem
# status bytes, which corrupt data silently if they are not stripped.
usbserial = "3.9.0"

[libraries]
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
usb-serial = { group = "com.github.mik3y", name = "usb-serial-for-android", version.ref = "usbserial" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
