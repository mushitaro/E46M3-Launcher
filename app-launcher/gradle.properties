# The only JDK on this machine is the one bundled with the Android SDK install.
# AGP 8.x requires 17, and this is 17.0.14, so pin it explicitly rather than
# depending on a JAVA_HOME that is not set in this environment.
org.gradle.java.home=C:/Program Files (x86)/Android/openjdk/jdk-17.0.14

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
