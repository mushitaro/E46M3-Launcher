# There is deliberately no `org.gradle.java.home` here.
#
# It used to pin an absolute path to one particular machine, which works on that
# machine and fails on every clone with a message about an invalid Java home,
# naming a directory the reader has never seen. A per-machine path belongs in a
# per-machine file.
#
# Gradle 8.9 / AGP 8.7 need **Java 17**. Supply it either way:
#
#   export JAVA_HOME=/path/to/jdk-17
#
# or, to pin it for every Gradle invocation on this machine:
#
#   echo 'org.gradle.java.home=/path/to/jdk-17' >> ~/.gradle/gradle.properties
#
# tools/jdk.sh finds one automatically for the scripts in tools/.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
