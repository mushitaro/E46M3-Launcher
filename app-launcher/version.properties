# The single source of truth for this app's version.
#
# Why a file and not literals in build.gradle.kts: the OTA system compares the
# versionCode it finds on the device against the one in a signed manifest, and
# `tools/release.sh` refuses to publish unless this number is strictly greater
# than the newest published release. Both of those need to read the value
# without running Gradle, so it lives somewhere a shell script can parse.
#
# Bumped by `tools/release.sh --bump patch|minor|major`, which commits the
# change before it builds. Editing it by hand is fine; skipping a number is
# fine; going backwards is not — see docs/07 on why rollback is a forward
# release rather than a downgrade.
#
# versionCode must be a plain integer: Android compares it numerically and the
# release script's `-gt` does too.
versionCode=2
versionName=0.2.0
